[project]
name = "nightwatch-pipeline"
version = "0.1.0"
description = "Night Watch async Lambdas: ingest, incident builder, seed, replay"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "nightwatch-core",
    "aws-lambda-powertools>=3",
]

[tool.uv.sources]
nightwatch-core = { path = "../shared", editable = true }

[dependency-groups]
dev = [
    # boto3 ships in the Lambda python3.12 runtime; bundled only for local runs and tests.
    "boto3>=1.35",
    "moto[dynamodb,events]>=5",
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightwatch_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["nightwatch_core", "nightwatch_pipeline"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
