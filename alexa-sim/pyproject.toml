[project]
name = "nightwatch-sim"
version = "0.1.0"
description = "Simulated Alexa+ client (unofficial) for the Night Watch MCP server"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "strands-agents==1.61.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightwatch_sim"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["nightwatch_sim"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
