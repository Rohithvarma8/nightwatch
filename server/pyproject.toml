[project]
name = "nightwatch"
version = "0.1.0"
description = "Night Watch MCP server: household incident commander for Alexa+"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "mcp==2.3.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
