[project]
name = "nightwatch"
version = "0.1.0"
description = "Night Watch MCP server: household incident commander for Alexa+"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "mcp==2.3.0",
    "uvicorn>=0.30",
    "nightwatch-core",
    "pyyaml>=6",
]

[tool.uv.sources]
nightwatch-core = { path = "../shared", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1.380",
    # boto3 ships in the Lambda python3.12 runtime; bundled only for local runs and tests.
    "boto3>=1.35",
    "moto[dynamodb]>=5",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["nightwatch", "nightwatch_core"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
